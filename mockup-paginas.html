<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockups das restantes páginas | TERO</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/mockup.css" />
  <link rel="stylesheet" href="css/mockup-pages.css" />
</head>
<body>
  <main class="mockup-gallery">
    <header class="gallery-intro">
      <h1>Mockups das restantes páginas</h1>
      <p>Estruturas visuais de baixa fidelidade, sem conteúdos finais.</p>
      <a href="mockup.html">Ver mockup da página inicial</a>
    </header>

    <section class="mockup-panel">
      <h2>Catálogo</h2>
      <div class="page-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <div class="page-content">
          <div class="page-title-block"><i></i><i></i></div>
          <div class="category-row"><i></i><i></i><i></i><i></i></div>
          <div class="catalogue-grid">
            <article class="catalogue-card">
              <div class="placeholder product-image"></div>
              <i class="text-line"></i><i class="text-line short"></i>
              <i class="placeholder product-action"></i>
            </article>
            <article class="catalogue-card">
              <div class="placeholder product-image"></div>
              <i class="text-line"></i><i class="text-line short"></i>
              <i class="placeholder product-action"></i>
            </article>
            <article class="catalogue-card">
              <div class="placeholder product-image"></div>
              <i class="text-line"></i><i class="text-line short"></i>
              <i class="placeholder product-action"></i>
            </article>
          </div>
        </div>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Encomendar</h2>
      <div class="page-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <div class="page-content">
          <div class="progress-row"><i></i><i></i><i></i><i></i></div>
          <div class="page-title-block"><i></i><i></i></div>
          <div class="order-layout">
            <div class="order-list">
              <article class="order-item">
                <div class="placeholder order-image"></div>
                <div class="order-lines"><i></i><i></i><i></i></div>
                <i class="placeholder product-action"></i>
              </article>
              <article class="order-item">
                <div class="placeholder order-image"></div>
                <div class="order-lines"><i></i><i></i><i></i></div>
                <i class="placeholder product-action"></i>
              </article>
            </div>
            <aside class="placeholder order-cart">
              <i class="text-line"></i><i class="text-line"></i>
              <i class="text-line short"></i><i class="placeholder product-action"></i>
            </aside>
          </div>
        </div>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Localização de entrega</h2>
      <div class="page-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <div class="page-content">
          <div class="progress-row"><i></i><i></i><i></i><i></i></div>
          <div class="page-title-block"><i></i><i></i></div>
          <div class="form-layout">
            <div class="placeholder form-card">
              <div class="form-fields"><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <i class="placeholder product-action"></i>
            </div>
            <div class="placeholder map-placeholder"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Pagamento</h2>
      <div class="page-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <div class="page-content">
          <div class="progress-row"><i></i><i></i><i></i><i></i></div>
          <div class="page-title-block"><i></i><i></i></div>
          <div class="payment-layout">
            <div class="payment-main">
              <div class="placeholder payment-card">
                <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
              </div>
              <div class="placeholder payment-card">
                <i class="text-line"></i>
                <i class="payment-option"></i><i class="payment-option"></i><i class="payment-option"></i>
              </div>
            </div>
            <aside class="placeholder payment-sidebar">
              <i class="text-line"></i><i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
            </aside>
          </div>
          <div class="action-row"><i></i><i></i></div>
        </div>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Perfil</h2>
      <div class="page-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <div class="page-content">
          <div class="page-title-block"><i></i></div>
          <div class="profile-layout">
            <aside class="placeholder profile-menu"><i></i><i></i><i></i></aside>
            <div class="profile-main">
              <div class="placeholder profile-summary">
                <div class="placeholder profile-avatar"></div>
                <div class="order-lines"><i></i><i></i></div>
              </div>
              <div class="placeholder profile-details">
                <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
              </div>
              <div class="placeholder profile-details">
                <i class="text-line"></i><i class="text-line"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Confirmação</h2>
      <div class="page-frame confirmation-frame" aria-hidden="true">
        <div class="confirmation-content">
          <div class="placeholder confirmation-icon"></div>
          <i class="confirmation-line"></i><i class="confirmation-line short"></i>
          <div class="confirmation-actions"><i></i><i></i></div>
        </div>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Privacidade e cookies</h2>
      <div class="page-frame legal-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <article class="legal-content">
          <div class="page-title-block"><i></i></div>
          <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
          <div class="legal-section">
            <i class="text-line heading"></i>
            <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
          </div>
          <div class="legal-section">
            <i class="text-line heading"></i>
            <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
          </div>
        </article>
      </div>
    </section>

    <section class="mockup-panel">
      <h2>Termos e condições</h2>
      <div class="page-frame legal-frame" aria-hidden="true">
        <header class="page-header">
          <span class="placeholder page-brand"></span>
          <div class="page-nav"><i></i><i></i><i></i></div>
          <span class="placeholder page-header-action"></span>
        </header>
        <article class="legal-content">
          <div class="page-title-block"><i></i></div>
          <i class="text-line"></i><i class="text-line short"></i>
          <div class="legal-section">
            <i class="text-line heading"></i>
            <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
          </div>
          <div class="legal-section">
            <i class="text-line heading"></i>
            <i class="text-line"></i><i class="text-line"></i><i class="text-line short"></i>
          </div>
          <div class="legal-section">
            <i class="text-line heading"></i>
            <i class="text-line"></i><i class="text-line short"></i>
          </div>
        </article>
      </div>
    </section>

</html>
