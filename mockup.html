<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockup da página inicial | TERO</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/mockup.css" />
</head>
<body>
  <div class="wireframe-page" aria-hidden="true">
    <header class="wireframe-header">
      <div class="placeholder brand"></div>
      <nav class="wireframe-nav">
        <span class="placeholder nav-item"></span>
        <span class="placeholder nav-item"></span>
        <span class="placeholder nav-item"></span>
      </nav>
      <span class="placeholder header-action"></span>
    </header>

    <main>
      <section class="hero">
        <div class="placeholder hero-image"></div>
        <div class="hero-copy">
          <span class="placeholder short-line"></span>
          <span class="placeholder title-line"></span>
          <span class="placeholder title-line title-line-short"></span>
          <span class="placeholder body-line"></span>
          <span class="placeholder body-line body-line-short"></span>
          <span class="placeholder hero-action"></span>
        </div>
      </section>

      <section class="overview">
        <article class="placeholder overview-card">
          <span class="placeholder card-line"></span>
          <span class="placeholder card-line card-line-short"></span>
        </article>
        <article class="placeholder overview-card">
          <span class="placeholder card-line"></span>
          <span class="placeholder card-line card-line-short"></span>
        </article>
        <article class="placeholder overview-card">
          <span class="placeholder card-line"></span>
          <span class="placeholder card-line card-line-short"></span>
        </article>
      </section>

      <section class="content-section">
        <span class="placeholder section-heading"></span>
        <div class="steps">
          <article class="placeholder step-card">
            <span class="placeholder card-line"></span>
            <span class="placeholder body-line"></span>
            <span class="placeholder body-line body-line-short"></span>
          </article>
          <article class="placeholder step-card">
            <span class="placeholder card-line"></span>
            <span class="placeholder body-line"></span>
            <span class="placeholder body-line body-line-short"></span>
          </article>
          <article class="placeholder step-card">
            <span class="placeholder card-line"></span>
            <span class="placeholder body-line"></span>
            <span class="placeholder body-line body-line-short"></span>
          </article>
        </div>
      </section>

      <section class="about-section">
        <div class="about-copy">
          <span class="placeholder section-heading"></span>
          <span class="placeholder body-line"></span>
          <span class="placeholder body-line"></span>
          <span class="placeholder body-line body-line-short"></span>
        </div>
        <div class="placeholder about-image"></div>
      </section>

      <section class="newsletter">
        <span class="placeholder section-heading"></span>
        <span class="placeholder body-line"></span>
        <div class="newsletter-form">
          <span class="placeholder input-placeholder"></span>
          <span class="placeholder form-action"></span>
        </div>
      </section>
    </main>

    <footer class="wireframe-footer">
      <div class="footer-column">
        <span class="placeholder footer-heading"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line footer-line-short"></span>
      </div>
      <div class="footer-column">
        <span class="placeholder footer-heading"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line footer-line-short"></span>
      </div>
      <div class="footer-column">
        <span class="placeholder footer-heading"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line footer-line-short"></span>
      </div>
      <div class="footer-column">
        <span class="placeholder footer-heading"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line"></span>
        <span class="placeholder footer-line footer-line-short"></span>
      </div>
    </footer>
  </div>
</body>
</html>
